name: Apply ConfigHub v5 files

on:
  push:
    paths:
      - confighub-android-v5.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip v5 and copy only the three files
        run: |
          unzip -o confighub-android-v5.zip
          cp confighub-android/app/src/main/java/com/confighub/android/ui/components/Components.kt app/src/main/java/com/confighub/android/ui/components/Components.kt
          cp confighub-android/app/src/main/java/com/confighub/android/ui/screens/HomeScreen.kt app/src/main/java/com/confighub/android/ui/screens/HomeScreen.kt
          cp confighub-android/app/src/main/java/com/confighub/android/data/Collector.kt app/src/main/java/com/confighub/android/data/Collector.kt
          wc -l app/src/main/java/com/confighub/android/ui/components/Components.kt app/src/main/java/com/confighub/android/ui/screens/HomeScreen.kt app/src/main/java/com/confighub/android/data/Collector.kt
          rm -rf confighub-android confighub-android-v5.zip .github/workflows/apply-v5.yml
          git config user.name "ahmad6975"
          git config user.email "ahmad6975@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Apply ConfigHub v5: Components, HomeScreen, Collector (byte-for-byte from v5 zip)"
          git push
