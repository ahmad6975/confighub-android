name: Apply ConfigHub v6 HomeScreen

on:
  push:
    paths:
      - confighub-android-v6.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip v6 and copy only HomeScreen.kt
        run: |
          unzip -o confighub-android-v6.zip
          cp confighub-android/app/src/main/java/com/confighub/android/ui/screens/HomeScreen.kt app/src/main/java/com/confighub/android/ui/screens/HomeScreen.kt
          wc -l app/src/main/java/com/confighub/android/ui/components/Components.kt app/src/main/java/com/confighub/android/ui/screens/HomeScreen.kt app/src/main/java/com/confighub/android/data/Collector.kt
          rm -rf confighub-android confighub-android-v6.zip .github/workflows/apply-v6.yml
          git config user.name "ahmad6975"
          git config user.email "ahmad6975@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Apply ConfigHub v6 HomeScreen only (byte-for-byte from v6 zip)"
          git push
